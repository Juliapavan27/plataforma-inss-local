name: Cron - Abandoned Cart

on:
  schedule:
    - cron: "*/30 * * * *" # a cada 30 minutos
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/abandoned-cart
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/abandoned-cart" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
